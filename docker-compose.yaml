service:
  catalogue:
    build: 
      dockerfile: ./catalogue
    image: nagendra2244/catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb

  user:
    duild:
      dockerfile: ./user
    image: nagendra2244/user:1.0.0  
    container_name: user
    depends_on:
    - redis  
    - mongobd 

  frontend:
    duild:
      dockerfile: ./frontend
    image: nagendra2244/frontend:1.0.0  
    container_name: frontend
    ports: 80:80
    depends_on:
    - catalogue
    - user 
    - cart 
    - shipping
    - payment

  cart:
    duild:
      dockerfile: ./cart
    image: nagendra2244/cart:1.0.0  
    container_name: cart
    depends_on:
    - redis 
    - catalogue  

  shipping:
    duild:
      dockerfile: ./shipping
    image: nagendra2244/shipping:1.0.0  
    container_name: shipping
    depends_on:
    - mysql
    - cart

  payment:
    duild:
      dockerfile: ./payment
    image: nagendra2244/payment:1.0.0  
    container_name: payment
    environment:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: "roboshop"
      AMQP_PASS: "roboshop123"
    depends_on:
    - rabbitmq
    - cart 
    - user

  mongodb:
    build: 
      dockerfile: ./mongodb  # It moves to mongodb directory
    image: nagendra2244/mongodb:1.0.0 # docker build -t nagendra2244/mongodb:1.0.0
    container_name: mongodb

  redis:
    image: redis:7.0
    container_name: redis

  mysql:
    build: 
      dockerfile: ./mysql  # It moves to mongodb directory
    image: nagendra2244/mysql:1.0.0 # docker build -t nagendra2244/mongodb:1.0.0
    container_name: mysql

  rabbitmq:
    image: rabbitmq:3
    environment: 
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    container_name: rabbitmq
    volumes:
    - rabbitmq:/var/lib/rabbitmq    

networks:
  default: 
    driver: bridge
    name: roboshop
    external: false # If true, you need to cretae network manually
